name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================
  # Lint & Type Check
  # ==========================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run build

  # ==========================
  # Tests
  # ==========================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: market_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/market_db_test
      DATABASE_URL_TEST: postgresql://test_user:test_password@localhost:5432/market_db_test
      APP_NAME: remitIQ-market-service
      APP_VERSION: 1.0.0
      PORT: 4001
      LOG_LEVEL: error
      JWT_SECRET: ci-test-secret-not-for-real-use
      CORS_ORIGIN: http://localhost:3000
      FX_API_URL: https://v6.exchangerate-api.com/v6
      FX_API_KEY: ${{ secrets.FX_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm run test

  # ==========================
  # Docker Build Verification
  # ==========================
  docker-build:
    name: Docker Build (production target)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          tags: remitiq-market-service:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max